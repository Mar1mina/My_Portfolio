<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --accent: #2563eb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--background);
        font-family: Arial, sans-serif;
        color: var(--text);
      }
      .card {
        width: min(90vw, 540px);
        background: var(--card);
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 2rem;
        text-align: center;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 2.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.6;
      }
      a {
        display: inline-block;
        background: var(--accent);
        color: white;
        padding: 0.8rem 1.2rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Page not found</h1>
      <p>The page you requested does not exist or has moved. Return to the portfolio home page.</p>
      <a href="/My_Portfolio/">Go to home</a>
    </main>

    <script>
      const repoPath = '/My_Portfolio';
      if (window.location.pathname !== repoPath && !window.location.pathname.endsWith('/')) {
        const url = new URL(window.location.href);
        const redirectTarget = `${repoPath}/?redirect=${encodeURIComponent(url.pathname + url.search)}`;
        window.location.replace(redirectTarget);
      }
    </script>
  </body>
</html>
